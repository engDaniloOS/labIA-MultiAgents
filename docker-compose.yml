services:
  agent-auto-bank:
    build:
      context: .
      dockerfile: Agent.Auto.Bank/Dockerfile
    container_name: agent-auto-bank
    environment:
      Agent__PublicUrl: http://agent-auto-bank:8080
    ports:
      - "5301:8080"

  agent-auto-hunter:
    build:
      context: .
      dockerfile: Agent.Auto.Hunter/Dockerfile
    container_name: agent-auto-hunter
    environment:
      Agent__PublicUrl: http://agent-auto-hunter:8080
    ports:
      - "5302:8080"

  agent-auto-seller:
    build:
      context: .
      dockerfile: Agent.Auto.Seller/Dockerfile
    container_name: agent-auto-seller
    environment:
      Agent__PublicUrl: http://agent-auto-seller:8080
    ports:
      - "5303:8080"

  orchestrator-api:
    build:
      context: .
      dockerfile: src/Orchestrator.Api/Dockerfile
    container_name: multiagents-orchestrator-api
    depends_on:
      - agent-auto-bank
      - agent-auto-hunter
      - agent-auto-seller
    environment:
      Tools__BaseUrl: http://tools-api:8080
      Agents__Bank__BaseUrl: http://agent-auto-bank:8080
      Agents__Hunter__BaseUrl: http://agent-auto-hunter:8080
      Agents__Seller__BaseUrl: http://agent-auto-seller:8080
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "5200:8080"